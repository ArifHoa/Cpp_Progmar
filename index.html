<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batahorror Calculator</title>
  
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css?family=Sofia&effect=neon|outline|emboss|shadow-multiple" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-dark text-white d-flex justify-content-center align-items-center vh-100">
  <div class="calculator container p-4 bg-secondary rounded shadow-lg" style="max-width: 400px;">
    <h2 class="font-effect-emboss text-center mb-3">Batahorror Calculator</h2>

    <input type="text" id="display" class="form-control mb-3 text-end fs-4" readonly />

    <div class="row g-2">
      <!-- First Row -->
      <div class="col-3"><button class="btn btn-danger w-100" onclick="clearDisplay()">C</button></div>
      <div class="col-3"><button class="btn btn-warning w-100" onclick="deleteChar()">DEL</button></div>
      <div class="col-3"><button class="btn btn-info w-100" onclick="appendChar('%')">%</button></div>
      <div class="col-3"><button class="btn btn-primary w-100" onclick="appendChar('/')">/</button></div>

      <!-- Second Row -->
      <div class="col-3"><button class="btn btn-light w-100" onclick="appendChar('7')">7</button></div>
      <div class="col-3"><button class="btn btn-light w-100" onclick="appendChar('8')">8</button></div>
      <div class="col-3"><button class="btn btn-light w-100" onclick="appendChar('9')">9</button></div>
      <div class="col-3"><button class="btn btn-primary w-100" onclick="appendChar('*')">×</button></div>

      <!-- Third Row -->
      <div class="col-3"><button class="btn btn-light w-100" onclick="appendChar('4')">4</button></div>
      <div class="col-3"><button class="btn btn-light w-100" onclick="appendChar('5')">5</button></div>
      <div class="col-3"><button class="btn btn-light w-100" onclick="appendChar('6')">6</button></div>
      <div class="col-3"><button class="btn btn-primary w-100" onclick="appendChar('-')">−</button></div>

      <!-- Fourth Row -->
      <div class="col-3"><button class="btn btn-light w-100" onclick="appendChar('1')">1</button></div>
      <div class="col-3"><button class="btn btn-light w-100" onclick="appendChar('2')">2</button></div>
      <div class="col-3"><button class="btn btn-light w-100" onclick="appendChar('3')">3</button></div>
      <div class="col-3"><button class="btn btn-primary w-100" onclick="appendChar('+')">+</button></div>

      <!-- Fifth Row -->
      <div class="col-6"><button class="btn btn-light w-100" onclick="appendChar('0')">0</button></div>
      <div class="col-3"><button class="btn btn-light w-100" onclick="appendChar('.')">.</button></div>
      <div class="col-3"><button class="btn btn-success w-100" onclick="calculate()">=</button></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
